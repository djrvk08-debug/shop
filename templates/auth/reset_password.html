{% extends "base.html" %}
{% block title %}Choose New Password | Dharti Fresh{% endblock %}
{% block content %}<div class="auth-wrapper"><div class="auth-card"><div class="auth-header"><h1 class="auth-title">Choose a new password</h1></div><form method="POST"><div class="form-group"><label class="form-label" for="password">New password</label><input class="form-control" id="password" name="password" type="password" minlength="6" required autocomplete="new-password"></div><div class="form-group"><label class="form-label" for="confirm_password">Confirm password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="6" required autocomplete="new-password"></div><button type="submit" class="btn btn-primary btn-block">Update password</button></form></div></div>{% endblock %}
